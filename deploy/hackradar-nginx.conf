# HackRadar: static Next.js export plus isolated FastAPI surface.
location = /scrapper {
    return 301 /scrapper/;
}

location ^~ /scrapper/_next/static/ {
    alias /srv/hackradar/frontend/current/_next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ^~ /scrapper/ {
    alias /srv/hackradar/frontend/current/;
    add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=1800" always;
    try_files $uri $uri/ /scrapper/index.html;
}

location = /scrapper-api/healthz {
    proxy_pass http://127.0.0.1:8095/healthz;
    proxy_set_header Host $host;
    proxy_read_timeout 5s;
}

location ^~ /scrapper-api/ {
    proxy_pass http://127.0.0.1:8095/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 32k;
}
