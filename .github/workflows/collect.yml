name: HackRadar refresh

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      source_slug:
        description: "Run one registered source slug; leave blank for all"
        required: false
        type: string
        default: devpost-global

permissions:
  contents: read

concurrency:
  group: hackradar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: hackradar-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Trigger bounded refresh jobs
        id: trigger
        env:
          HACKRADAR_API_URL: ${{ secrets.HACKRADAR_API_URL }}
          HACKRADAR_OPERATOR_TOKEN: ${{ secrets.HACKRADAR_OPERATOR_TOKEN }}
          HACKRADAR_SOURCE_SLUG: ${{ inputs.source_slug }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HACKRADAR_API_URL" || { echo "::error::HACKRADAR_API_URL is missing"; exit 1; }
          test -n "$HACKRADAR_OPERATOR_TOKEN" || { echo "::error::HACKRADAR_OPERATOR_TOKEN is missing"; exit 1; }
          payload='{}'
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$HACKRADAR_SOURCE_SLUG" ]; then
            [[ "$HACKRADAR_SOURCE_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::invalid source slug"; exit 1; }
            payload="{\"sourceSlug\":\"$HACKRADAR_SOURCE_SLUG\"}"
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$HACKRADAR_API_URL/operators/refresh" \
            -H 'Content-Type: application/json' \
            -H "X-HackRadar-Operator-Token: $HACKRADAR_OPERATOR_TOKEN" \
            --data "$payload")"
          jobs="$(jq -r '.jobs | length' <<<"$response")"
          test "$jobs" -gt 0 || { echo "::error::no runnable collectors were queued"; exit 1; }
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

      - name: Publish safe summary
        run: |
          {
            echo '### HackRadar refresh'
            echo ''
            echo "- Queued jobs: ${{ steps.trigger.outputs.jobs }}"
            echo '- Drifted runs preserve the last-known-good dataset and can trigger same-ID healing.'
          } >> "$GITHUB_STEP_SUMMARY"
