name: Raster quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: raster-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject known secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|(^|[^A-Z_])(api_key|token|secret)[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}' -- . ':!package-lock.json'; then
            echo '::error::probable secret material found in tracked source'
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit, migration, and security tests
        run: npm run test:unit

      - name: Production render tests
        run: npm run test:render
